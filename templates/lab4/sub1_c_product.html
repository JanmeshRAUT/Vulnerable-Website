{% extends 'base.html' %}
{% block title %}Logistics - {{ product.name }}{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/labs/lab4/sub1.css') }}">
{% endblock %}

{% block content %}
    <div class="l4-base theme-c">
        <a href="{{ url_for('lab4_1c') }}" class="l4-nav-back">&larr; Back to Shop</a>

        <div class="l4-detail-grid">
            <div class="l4-img-wrapper" class="l4-detail-img-box">
                <img src="{{ product.image }}" alt="{{ product.name }}">
            </div>
            <div class="l4-detail-content">
                <h1>{{ product.name }}</h1>
                <p class="l4-detail-desc">{{ product.description }}</p>
                <div class="l4-detail-price">${{ product.price }}</div>
                
                <div class="l4-stock-box">
                    <form action="{{ url_for('lab4_1_stock') }}" method="POST" id="stockForm">
                        <input type="hidden" name="stockApi" value="http://localhost:5000/stock/check?id={{ product.id }}">
                        <button type="submit" class="l4-btn" class="l4-btn-block">Check Stock Status</button>
                    </form>
                    <div id="stockResult" class="l4-stock-result"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('stockForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const resultDiv = document.getElementById('stockResult');
            resultDiv.innerText = "Checking stock...";
            resultDiv.className = "l4-stock-result";
            
            const formData = new FormData(this);
            const urlEncodedData = new URLSearchParams(formData).toString();

            fetch('/lab4/1/stock', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: urlEncodedData
            })
            .then(res => res.text())
            .then(data => {
                if (data.includes('Success')) {
                     resultDiv.innerHTML = data;
                     resultDiv.classList.add('l4-result-success');
                } else if (data.includes('403') || data.includes('Admin')) {
                     resultDiv.innerHTML = data;
                     resultDiv.classList.add('l4-result-warning');
                } else {
                     resultDiv.innerText = data;
                     resultDiv.classList.add('l4-result-success');
                }
            })
            .catch(err => {
                resultDiv.innerText = "Error: " + err;
                resultDiv.classList.add('l4-result-error');
            });
        });
    </script>
{% endblock %}
