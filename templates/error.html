{% extends 'base.html' %}
{% block title %}Access Restricted - RESEARCH_OPS{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card glass-morphism animate-fade-in" style="max-width: 500px; text-align: center; padding: 3rem;">
        <div class="auth-header">
            <div class="auth-logo-icon" style="background: rgba(220, 53, 69, 0.1); color: var(--error-color, #ff4d4d);">🔒</div>
            <h1 style="font-size: 2rem; margin-bottom: 1rem;">Access Restricted</h1>
            <p style="color: var(--text-muted); line-height: 1.6;">{{ message }}</p>
            {% if subtext %}
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">{{ subtext }}</p>
            {% endif %}
        </div>

        <div style="margin-top: 2.5rem; display: flex; flex-direction: column; gap: 1rem;">
            <a href="{{ action_link or url_for('home') }}" class="auth-submit-button-premium" style="text-decoration: none;">
                <span>{{ action_text or 'Return to Dashboard' }}</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
            </a>
            
            <a href="{{ url_for('help_page') }}" class="accent-link" style="font-size: 0.9rem;">Contact Administrator for Assistance</a>
        </div>
    </div>

    <div class="auth-background-decoration">
        <div class="blob blob-1" style="background: rgba(255, 77, 77, 0.2);"></div>
        <div class="blob blob-2" style="background: rgba(0, 123, 255, 0.1);"></div>
    </div>
</div>
{% endblock %}
